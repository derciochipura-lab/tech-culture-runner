<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz & Culture Runner - Feira de Exposições</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #090d16;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        .game-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 800px;
            background: #111827;
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px solid #00f0ff;
            position: relative;
        }

        @media (min-width: 480px) {
            .game-container {
                border-radius: 16px;
                height: 700px;
            }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #0b0f19;
            border-bottom: 2px solid #1f2937;
        }

        .stats {
            display: flex;
            gap: 12px;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .stat-item span {
            color: #00f0ff;
        }

        .pause-btn {
            background: #1f2937;
            color: #00f0ff;
            border: 1px solid #00f0ff;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .canvas-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom, #070a14 0%, #0f172a 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        .overlay h1 {
            font-size: 1.8rem;
            color: #00f0ff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .overlay p {
            font-size: 0.95rem;
            color: #cbd5e1;
            margin-bottom: 20px;
            max-width: 350px;
        }

        .btn {
            background: #00f0ff;
            color: #090d16;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .btn:hover {
            background: #70f8ff;
        }

        .mobile-touch-area {
            background: linear-gradient(135deg, #0b0f19, #1e293b);
            padding: 15px 20px;
            text-align: center;
            border-top: 2px solid #00f0ff;
        }

        .jump-btn-big {
            width: 100%;
            background: #00f0ff;
            color: #090d16;
            border: none;
            padding: 16px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 240, 255, 0.4);
            letter-spacing: 1px;
            cursor: pointer;
        }

        .jump-btn-big:active {
            background: #70f8ff;
            transform: scale(0.98);
        }

        #quiz-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.97);
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            text-align: center;
        }

        .quiz-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #00f0ff;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
        }

        .quiz-category {
            font-size: 0.75rem;
            color: #38bdf8;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .quiz-box h3 {
            color: #ffffff;
            margin: 10px 0 15px 0;
            font-size: 1rem;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .option-btn {
            background: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
        }

        .option-btn:hover, .option-btn:active {
            background: #00f0ff;
            color: #090d16;
            font-weight: bold;
        }

        #explanation-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.97);
            z-index: 25;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            text-align: center;
        }

        .explanation-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #ef4444;
            width: 100%;
            max-width: 400px;
        }

        .explanation-box h3 {
            color: #ef4444;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .explanation-box p {
            color: #f8fafc;
            margin-bottom: 15px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        #correct-answer-display {
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        #feedback-banner {
            display: none;
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            z-index: 30;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .feedback-correct { background: #10b981; color: white; }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="feedback-banner"></div>

        <div class="header">
            <div class="stats">
                <div class="stat-item">Pontos: <span id="score">0</span></div>
                <div class="stat-item">Recorde: <span id="highscore">0</span></div>
            </div>
            <div class="stats">
                <div class="stat-item">Vidas: <span id="lives">❤️ ❤️ ❤️</span></div>
                <button class="pause-btn" id="pauseBtn" onclick="togglePause()">⏸️</button>
            </div>
        </div>

        <div class="canvas-wrapper" id="canvasArea">
            <canvas id="gameCanvas" width="400" height="300"></canvas>

            <div id="start-screen" class="overlay">
                <h1>Quiz & Culture Runner</h1>
                <p>Responde a perguntas de cultura geral e tecnologia. Toca em saltar para começar!</p>
                <button class="btn" id="startBtn" onclick="startGame()">Iniciar Jogo</button>
            </div>

            <div id="gameover-screen" class="overlay" style="display: none;">
                <h1>Fim do Jogo!</h1>
                <p id="final-msg">Ficaste sem vidas!</p>
                <button class="btn" onclick="startGame()">Tentar Novamente</button>
            </div>

            <div id="quiz-modal">
                <div class="quiz-box">
                    <div class="quiz-category" id="quiz-cat">Categoria</div>
                    <h3 id="quiz-question">Pergunta aqui...</h3>
                    <div class="quiz-options" id="quiz-options"></div>
                </div>
            </div>

            <div id="explanation-modal">
                <div class="explanation-box">
                    <h3>❌ Resposta Incorreta!</h3>
                    <div id="correct-answer-display">A resposta certa era: ...</div>
                    <p id="explanation-text">Explicação aqui...</p>
                    <button class="btn" onclick="closeExplanationAndGameOver()">Continuar</button>
                </div>
            </div>
        </div>

        <!-- ÁREA DO BOTÃO GRANDE DE SALTAR -->
        <div class="mobile-touch-area">
            <button class="jump-btn-big" id="jumpBtn">👆 SALTAR</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreEl = document.getElementById("score");
        const highscoreEl = document.getElementById("highscore");
        const livesEl = document.getElementById("lives");
        const startScreen = document.getElementById("start-screen");
        const gameoverScreen = document.getElementById("gameover-screen");
        const finalMsg = document.getElementById("final-msg");
        const quizModal = document.getElementById("quiz-modal");
        const quizCat = document.getElementById("quiz-cat");
        const quizQuestion = document.getElementById("quiz-question");
        const quizOptions = document.getElementById("quiz-options");
        const explanationModal = document.getElementById("explanation-modal");
        const correctAnswerDisplay = document.getElementById("correct-answer-display");
        const explanationText = document.getElementById("explanation-text");
        const jumpBtn = document.getElementById("jumpBtn");
        const canvasArea = document.getElementById("canvasArea");
        const feedbackBanner = document.getElementById("feedback-banner");
        const pauseBtn = document.getElementById("pauseBtn");

        const masterQuestions = [
            { cat: "💻 Tecnologia", q: "O que significa a sigla CPU num computador?", options: ["Unidade Central de Processamento", "Cabo Principal Universal", "Controlo de Placa Única"], correct: 0, explanation: "O CPU é o circuito eletrónico principal responsável por executar instruções de programas." },
            { cat: "💻 Tecnologia", q: "Para que serve a memória RAM?", options: ["Armazenar dados temporários de trabalho rápido", "Guardar permanentemente fotos e vídeos", "Reduzir o aquecimento da fonte de energia"], correct: 0, explanation: "A RAM armazena temporariamente os dados dos programas em execução para acesso rápido pelo CPU." },
            { cat: "💻 Tecnologia", q: "O que é um endereço IP numa rede?", options: ["Identificador numérico único de um dispositivo", "A velocidade máxima da ligação à internet", "Um programa antivírus instalado de fábrica"], correct: 0, explanation: "O IP funciona como a morada postal digital de um equipamento conectado a uma rede." },
            { cat: "💻 Tecnologia", q: "Qual comando SQL é usado para consultar dados de uma tabela?", options: ["SELECT", "UPDATE", "INSERT"], correct: 0, explanation: "O comando SELECT é a instrução padrão em SQL para recuperar e consultar dados." },
            { cat: "💻 Tecnologia", q: "O que significa a linguagem de marcação HTML?", options: ["HyperText Markup Language", "High Tech Modern Line", "Hyper Transfer Main Loop"], correct: 0, explanation: "HTML é a linguagem base usada para estruturar os conteúdos das páginas na web." },
            { cat: "💻 Tecnologia", q: "O que é a computação em nuvem (Cloud Computing)?", options: ["Acesso a serviços e ficheiros via Internet sem guardar localmente", "Utilização de computadores movidos a energia solar", "Ligação direta de dois telemóveis por cabo"], correct: 0, explanation: "A nuvem permite guardar dados e executar aplicações em servidores remotos através da internet." },
            { cat: "🌍 Geografia", q: "Qual é a capital da República de Moçambique?", options: ["Maputo", "Beira", "Nampula"], correct: 0, explanation: "Maputo é a capital política e administrativa de Moçambique." },
            { cat: "🌍 Geografia", q: "Qual o oceano que banha a costa leste de Moçambique?", options: ["Oceano Índico", "Oceano Atlântico", "Oceano Pacífico"], correct: 0, explanation: "Toda a zona costeira oriental de Moçambique é banhada pelo Oceano Índico." },
            { cat: "🌍 Geografia", q: "Qual é o maior planeta do nosso Sistema Solar?", options: ["Júpiter", "Saturno", "Neptuno"], correct: 0, explanation: "Júpiter é um gigante gasoso e o maior planeta a orbitar o Sol." },
            { cat: "📜 História", q: "Em que ano foi proclamada a Independência de Moçambique?", options: ["1975", "1964", "1980"], correct: 0, explanation: "Moçambique proclamou a sua independência nacional a 25 de junho de 1975." },
            { cat: "📜 História", q: "Quem foi o primeiro Presidente de Moçambique independente?", options: ["Samora Machel", "Eduardo Mondlane", "Joaquim Chissano"], correct: 0, explanation: "Samora Moisés Machel assumiu como o primeiro Presidente do país em 1975." },
            { cat: "🔬 Ciência", q: "Qual é a velocidade aproximada da luz no vácuo?", options: ["300.000 km por segundo", "150.000 km por segundo", "1.000.000 km por segundo"], correct: 0, explanation: "A luz viaja no vácuo a uma velocidade aproximada de 300.000 quilómetros por segundo." },
            { cat: "⚽ Desporto", q: "Qual atleta moçambicana ganhou a medalha de ouro nos Jogos Olímpicos de 2000?", options: ["Lurdes Mutola", "Maria de Lurdes", "Elisa Cossa"], correct: 0, explanation: "Lurdes Mutola conquistou a medalha de ouro olímpica na prova dos 800 metros em Sidney 2000." },
            { cat: "🎨 Cultura", q: "Qual é a moeda oficial emitida e utilizada em Moçambique?", options: ["Metical", "Rand", "Dólar"], correct: 0, explanation: "O Metical é a unidade monetária oficial da República de Moçambique." }
        ];

        let activeQuestions = [];
        let questionIndex = 0;

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let runSoundInterval = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(550, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } else if (type === 'step') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(80, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'heart') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'hit' || type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        function startRunningSound() {
            if (runSoundInterval) clearInterval(runSoundInterval);
            runSoundInterval = setInterval(() => {
                if (gameRunning && !gamePaused && player.grounded) {
                    playSound('step');
                }
            }, 250);
        }

        function stopRunningSound() {
            if (runSoundInterval) {
                clearInterval(runSoundInterval);
                runSoundInterval = null;
            }
        }

        let score = 0;
        let highscore = localStorage.getItem("techCultureHighscore") || 0;
        highscoreEl.innerText = highscore;
        let lives = 3;
        let gameRunning = false;
        let gamePaused = false;
        let frameCount = 0;
        let speed = 5.5;
        let correctOptionText = "";
        let lastExplanation = "";
        let nextLifeMilestone = 500;

        const player = {
            x: 60,
            y: 200,
            width: 32,
            height: 50,
            dy: 0,
            jumpPower: -11,
            gravity: 0.65,
            grounded: true,
            animFrame: 0
        };

        let obstacles = [];
        let nextQuizScore = 100;

        function shuffleQuestions() {
            let arr = [...masterQuestions];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                e.preventDefault();
                handleAction();
            } else if (e.code === "KeyP") {
                togglePause();
            }
        });

        // Eventos para o Botão SALTAR
        jumpBtn.addEventListener("touchstart", (e) => {
            e.preventDefault();
            handleAction();
        }, { passive: false });

        jumpBtn.addEventListener("click", (e) => {
            e.preventDefault();
            handleAction();
        });

        // Eventos para toque direto no Canvas
        canvasArea.addEventListener("touchstart", (e) => {
            e.preventDefault();
            handleAction();
        }, { passive: false });

        canvasArea.addEventListener("click", (e) => {
            e.preventDefault();
            handleAction();
        });

        function handleAction() {
            initAudio();
            if (!gameRunning && startScreen.style.display !== "none") {
                startGame();
            } else if (!gameRunning && gameoverScreen.style.display !== "none") {
                startGame();
            } else if (!gamePaused) {
                jump();
            }
        }

        function togglePause() {
            if (!gameRunning) return;
            gamePaused = !gamePaused;
            if (gamePaused) {
                pauseBtn.innerText = "▶️";
                stopRunningSound();
            } else {
                pauseBtn.innerText = "⏸️";
                startRunningSound();
                loop();
            }
        }

        function jump() {
            if (player.grounded && gameRunning && !gamePaused) {
                player.dy = player.jumpPower;
                player.grounded = false;
                playSound('jump');
            }
        }

        function startGame() {
            initAudio();
            startScreen.style.display = "none";
            gameoverScreen.style.display = "none";
            quizModal.style.display = "none";
            explanationModal.style.display = "none";
            score = 0;
            lives = 3;
            speed = 5.5;
            obstacles = [];
            nextQuizScore = 100;
            nextLifeMilestone = 500;
            activeQuestions = shuffleQuestions();
            questionIndex = 0;
            player.y = 200;
            player.dy = 0;
            player.grounded = true;
            updateLivesUI();
            gameRunning = true;
            gamePaused = false;
            pauseBtn.innerText = "⏸️";
            startRunningSound();
            loop();
        }

        function updateLivesUI() {
            let hText = "";
            for (let i = 0; i < lives; i++) hText += "❤️ ";
            livesEl.innerText = hText;
        }

        function spawnObstacle() {
            const types = ["BUG", "ERRO", "404", "GLITCH"];
            const label = types[Math.floor(Math.random() * types.length)];
            obstacles.push({
                x: canvas.width,
                y: 220,
                width: 28,
                height: 32,
                label: label
            });
        }

        function showBanner(text) {
            feedbackBanner.innerText = text;
            feedbackBanner.className = 'feedback-correct';
            feedbackBanner.style.display = 'block';
            setTimeout(() => { feedbackBanner.style.display = 'none'; }, 1500);
        }

        function triggerQuiz() {
            gamePaused = true;
            stopRunningSound();

            if (questionIndex >= activeQuestions.length) {
                activeQuestions = shuffleQuestions();
                questionIndex = 0;
            }

            const qObj = activeQuestions[questionIndex];
            questionIndex++;

            quizCat.innerText = qObj.cat;
            quizQuestion.innerText = qObj.q;
            quizOptions.innerHTML = "";
            
            lastExplanation = qObj.explanation;

            let optionsList = qObj.options.map((opt, idx) => ({
                text: opt,
                isCorrect: (idx === qObj.correct)
            }));

            for (let i = optionsList.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [optionsList[i], optionsList[j]] = [optionsList[j], optionsList[i]];
            }

            let correctObj = optionsList.find(o => o.isCorrect);
            correctOptionText = correctObj.text;

            optionsList.forEach((optItem, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = `${index + 1}. ${optItem.text}`;
                btn.onclick = () => checkAnswer(optItem.isCorrect);
                quizOptions.appendChild(btn);
            });

            quizModal.style.display = "flex";
        }

        function checkAnswer(isCorrect) {
            quizModal.style.display = "none";
            if (isCorrect) {
                playSound('correct');
                score += 100;
                scoreEl.innerText = score;
                showBanner("✨ Resposta Certa! +100 Pontos", "correct");
                nextQuizScore = score + 100;
                gamePaused = false;
                startRunningSound();
                loop();
            } else {
                playSound('wrong');
                correctAnswerDisplay.innerText = `✅ Opção Correta: "${correctOptionText}"`;
                explanationText.innerText = lastExplanation;
                explanationModal.style.display = "flex";
            }
        }

        function closeExplanationAndGameOver() {
            explanationModal.style.display = "none";
            gameOver("Errou a questão! Veja a resposta correta acima.");
        }

        function gameOver(msg) {
            gameRunning = false;
            stopRunningSound();
            playSound('hit');
            finalMsg.innerText = msg;
            if (score > highscore) {
                highscore = score;
                localStorage.setItem("techCultureHighscore", highscore);
                highscoreEl.innerText = highscore;
            }
            gameoverScreen.style.display = "flex";
        }

        function drawMan(x, y, grounded, frame) {
            ctx.save();
            ctx.translate(x, y);

            ctx.fillStyle = "#e0ac69";
            ctx.beginPath();
            ctx.arc(16, 9, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#1e1b18";
            ctx.beginPath();
            ctx.arc(16, 5, 7.5, Math.PI, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#00f0ff";
            ctx.fillRect(9, 16, 15, 20);

            ctx.strokeStyle = "#1e293b";
            ctx.lineWidth = 3.5;
            ctx.lineCap = "round";

            let legCycle = grounded ? Math.sin(frame * 0.22) * 10 : 12;
            
            ctx.beginPath();
            ctx.moveTo(11, 36);
            ctx.lineTo(11 - legCycle, 48);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(21, 36);
            ctx.lineTo(21 + legCycle, 48);
            ctx.stroke();

            ctx.strokeStyle = "#e0ac69";
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(10, 18);
            ctx.lineTo(10 + legCycle, 28);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(22, 18);
            ctx.lineTo(22 - legCycle, 28);
            ctx.stroke();

            ctx.restore();
        }

        function loop() {
            if (!gameRunning || gamePaused) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#0b0f19";
            ctx.fillRect(0, 250, canvas.width, 50);
            ctx.strokeStyle = "#00f0ff";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 250);
            ctx.lineTo(canvas.width, 250);
            ctx.stroke();

            player.dy += player.gravity;
            player.y += player.dy;

            if (player.y > 200) {
                player.y = 200;
                player.dy = 0;
                player.grounded = true;
            }

            player.animFrame++;
            drawMan(player.x, player.y, player.grounded, player.animFrame);

            if (frameCount % 110 === 0) {
                spawnObstacle();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= speed;

                ctx.fillStyle = "#ef4444";
                ctx.beginPath();
                ctx.roundRect(obs.x, obs.y, obs.width, obs.height, 5);
                ctx.fill();
                ctx.strokeStyle = "#fca5a5";
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 7px sans-serif";
                ctx.fillText(obs.label, obs.x + 2, obs.y + 20);

                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y
                ) {
                    playSound('hit');
                    obstacles.splice(i, 1);
                    lives--;
                    updateLivesUI();

                    if (lives <= 0) {
                        gameOver("Esgotou todas as vidas ao colidir com os obstáculos!");
                        return;
                    } else {
                        showBanner("💥 Colisão! Perdeu 1 vida.", "wrong");
                    }
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreEl.innerText = score;

                    if (score >= nextLifeMilestone) {
                        if (lives < 3) {
                            lives++;
                            updateLivesUI();
                            playSound('heart');
                            showBanner("💖 Marco de 500 pontos! +1 Vida ganha!", "correct");
                        }
                        nextLifeMilestone += 500;
                    }

                    if (score >= nextQuizScore) {
                        triggerQuiz();
                        return;
                    }
                }
            }

            speed = 5.5 + Math.floor(score / 350);
            frameCount++;

            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
