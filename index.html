<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz & Culture Runner - Feira de Exposições</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #050811;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* MOLDURA PRINCIPAL DO JOGO (TUDO DENTRO DA CAIXA) */
        .game-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 780px;
            background: #0f172a;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px solid #00f0ff;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 480px) {
            .game-container {
                border-radius: 16px;
                height: 720px;
            }
        }

        /* CABEÇALHO */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(11, 15, 25, 0.98);
            border-bottom: 2px solid rgba(0, 240, 255, 0.3);
            z-index: 5;
            flex-shrink: 0;
        }

        .stats-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-badge {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #94a3b8;
        }

        .stat-badge span {
            color: #00f0ff;
            font-size: 0.8rem;
            margin-left: 2px;
        }

        .lives-badge {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .pause-btn {
            background: #1e293b;
            color: #00f0ff;
            border: 1px solid #00f0ff;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }

        /* ÁREA DO CANVAS (JOGO) */
        .canvas-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #0f172a 0%, #070a14 100%);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ECRÃS DE OVERLAY (INICIAL / GAME OVER) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 10, 20, 0.96);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        .overlay h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #00f0ff;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }

        .overlay p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 16px;
            max-width: 280px;
            line-height: 1.4;
        }

        .btn {
            background: linear-gradient(135deg, #00f0ff, #00a8ff);
            color: #050811;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            text-transform: uppercase;
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* BOTÃO SALTAR AGORA DENTRO DO ESPAÇO VAZIO INFERIOR DA MOLDURA */
        .mobile-touch-area {
            background: #070a14;
            padding: 8px 12px;
            text-align: center;
            border-top: 2px solid rgba(0, 240, 255, 0.3);
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            z-index: 5;
        }

        .jump-btn-big {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #00f0ff 0%, #3b82f6 100%);
            color: #050811;
            border: none;
            font-size: 1.2rem;
            font-weight: 900;
            border-radius: 8px;
            box-shadow: 0 3px 15px rgba(0, 240, 255, 0.4);
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .jump-btn-big:active {
            background: #70f8ff;
            transform: scale(0.97);
        }

        /* MODAL QUIZ */
        #quiz-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 10, 20, 0.96);
            backdrop-filter: blur(8px);
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .quiz-box {
            background: #1e293b;
            padding: 16px;
            border-radius: 14px;
            border: 2px solid #00f0ff;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
            text-align: center;
        }

        .quiz-category {
            font-size: 0.7rem;
            color: #38bdf8;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .quiz-box h3 {
            color: #ffffff;
            margin-bottom: 12px;
            font-size: 0.9rem;
            line-height: 1.3;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-btn {
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .option-btn:active {
            background: #00f0ff;
            color: #050811;
        }

        /* MODAL EXPLICAÇÃO */
        #explanation-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 10, 20, 0.96);
            backdrop-filter: blur(8px);
            z-index: 25;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            text-align: center;
        }

        .explanation-box {
            background: #1e293b;
            padding: 16px;
            border-radius: 14px;
            border: 2px solid #ef4444;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.3);
        }

        .explanation-box h3 {
            color: #ef4444;
            margin-bottom: 8px;
            font-size: 1rem;
            font-weight: 800;
        }

        .explanation-box p {
            color: #cbd5e1;
            margin-bottom: 12px;
            font-size: 0.8rem;
            line-height: 1.4;
        }

        #correct-answer-display {
            background: #0f172a;
            color: #38bdf8;
            padding: 8px;
            border-radius: 6px;
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 0.8rem;
            border: 1px solid #334155;
        }

        #feedback-banner {
            display: none;
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.75rem;
            z-index: 30;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            white-space: nowrap;
        }
        .feedback-correct { background: #10b981; color: white; border: 1px solid #34d399; }
        .feedback-wrong { background: #ef4444; color: white; border: 1px solid #fca5a5; }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="feedback-banner"></div>

        <!-- CABEÇALHO -->
        <div class="header">
            <div class="stats-group">
                <div class="stat-badge">Pontos: <span id="score">0</span></div>
                <div class="stat-badge">Recorde: <span id="highscore">0</span></div>
            </div>
            <div class="stats-group">
                <div class="lives-badge" id="lives">❤️ ❤️ ❤️</div>
                <button class="pause-btn" id="pauseBtn" onclick="togglePause()">⏸️</button>
            </div>
        </div>

        <!-- ÁREA DO JOGO (CANVAS) -->
        <div class="canvas-wrapper" id="canvasArea">
            <canvas id="gameCanvas" width="400" height="260"></canvas>

            <div id="start-screen" class="overlay">
                <h1>Quiz & Culture Runner</h1>
                <p>Responde a perguntas divertidas de cultura geral, geografia e história. Toca em saltar para começar!</p>
                <button class="btn" id="startBtn" onclick="startGame()">Iniciar Jogo</button>
            </div>

            <div id="gameover-screen" class="overlay" style="display: none;">
                <h1>Fim do Jogo!</h1>
                <p id="final-msg">Ficaste sem vidas!</p>
                <button class="btn" onclick="startGame()">Tentar Novamente</button>
            </div>

            <div id="quiz-modal">
                <div class="quiz-box">
                    <div class="quiz-category" id="quiz-cat">Categoria</div>
                    <h3 id="quiz-question">Pergunta aqui...</h3>
                    <div class="quiz-options" id="quiz-options"></div>
                </div>
            </div>

            <div id="explanation-modal">
                <div class="explanation-box">
                    <h3>❌ Resposta Incorreta!</h3>
                    <div id="correct-answer-display">A resposta certa era: ...</div>
                    <p id="explanation-text">Explicação aqui...</p>
                    <button class="btn" onclick="closeExplanationAndGameOver()">Continuar</button>
                </div>
            </div>
        </div>

        <!-- BOTÃO SALTAR DENTRO DA MOLDURA NO ESPAÇO INFERIOR -->
        <div class="mobile-touch-area">
            <button class="jump-btn-big" id="jumpBtn">👆 SALTAR</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreEl = document.getElementById("score");
        const highscoreEl = document.getElementById("highscore");
        const livesEl = document.getElementById("lives");
        const startScreen = document.getElementById("start-screen");
        const gameoverScreen = document.getElementById("gameover-screen");
        const finalMsg = document.getElementById("final-msg");
        const quizModal = document.getElementById("quiz-modal");
        const quizCat = document.getElementById("quiz-cat");
        const quizQuestion = document.getElementById("quiz-question");
        const quizOptions = document.getElementById("quiz-options");
        const explanationModal = document.getElementById("explanation-modal");
        const correctAnswerDisplay = document.getElementById("correct-answer-display");
        const explanationText = document.getElementById("explanation-text");
        const jumpBtn = document.getElementById("jumpBtn");
        const canvasArea = document.getElementById("canvasArea");
        const feedbackBanner = document.getElementById("feedback-banner");
        const pauseBtn = document.getElementById("pauseBtn");

        const masterQuestions = [
            { cat: "🌍 Geografia", q: "Qual é a capital de Moçambique?", options: ["Maputo", "Beira", "Nampula"], correct: 0, explanation: "Maputo é a capital e a maior cidade de Moçambique." },
            { cat: "🌍 Geografia", q: "Qual é o oceano que banha a costa de Moçambique?", options: ["Oceano Índico", "Oceano Atlântico", "Oceano Pacífico"], correct: 0, explanation: "A costa oriental moçambicana é inteiramente banhada pelo Oceano Índico." },
            { cat: "📜 História", q: "Em que ano Moçambique tornou-se independente?", options: ["1975", "1964", "1980"], correct: 0, explanation: "A independência nacional de Moçambique foi proclamada a 25 de junho de 1975." },
            { cat: "⚽ Desporto", q: "Qual foi a atleta moçambicana que ganhou a primeira medalha de ouro olímpica?", options: ["Lurdes Mutola", "Maria de Lurdes", "Elisa Cossa"], correct: 0, explanation: "Lurdes Mutola conquistou o ouro nos 800 metros nos Jogos Olímpicos de Sidney em 2000." },
            { cat: "🎨 Cultura", q: "Qual é a moeda oficial de Moçambique?", options: ["Metical", "Rand", "Dólar"], correct: 0, explanation: "O Metical é a unidade monetária oficial emitida pelo Banco de Moçambique." },
            { cat: "🌍 Geografia", q: "Qual é o maior planeta do nosso Sistema Solar?", options: ["Júpiter", "Saturno", "Terra"], correct: 0, explanation: "Júpiter é um gigante gasoso e o maior planeta a orbitar o Sol." },
            { cat: "🔬 Ciência", q: "De que cor é o céu em um dia limpo e ensolarado?", options: ["Azul", "Verde", "Vermelho"], correct: 0, explanation: "O céu aparece azul devido à forma como a luz do Sol interage com a atmosfera da Terra." },
            { cat: "🍎 Curiosidades", q: "Quantas cores tem o arco-íris?", options: ["7 cores", "5 cores", "10 cores"], correct: 0, explanation: "O arco-íris é composto tradicionalmente por sete cores visíveis: vermelho, laranja, amarelo, verde, azul, anil e violeta." },
            { cat: "🌍 Geografia", q: "Em que continente fica o Deserto do Saara?", options: ["África", "Ásia", "América do Sul"], correct: 0, explanation: "O Saara é o maior deserto quente do mundo e localiza-se no norte de África." },
            { cat: "⚽ Desporto", q: "Quantos jogadores compõem uma equipa de futebol em campo?", options: ["11 jogadores", "7 jogadores", "5 jogadores"], correct: 0, explanation: "Cada equipa de futebol tradicional em campo é formada por 11 jogadores." },
            { cat: "🎬 Cinema", q: "Qual destes animais é o protagonista do filme 'O Rei Leão'?", options: ["Um leão", "Um tigre", "Um leopardo"], correct: 0, explanation: "Simba é um leão jovem que aprende sobre o ciclo da vida e o seu lugar como rei." },
            { cat: "🌍 Geografia", q: "Qual é o país mais populoso do mundo atualmente?", options: ["Índia", "Brasil", "Japão"], correct: 0, explanation: "A Índia e a China destacam-se como os países com maior população mundial." },
            { cat: "🔬 Ciência", q: "Qual é o elemento químico essencial para a respiração humana?", options: ["Oxigénio", "Hélio", "Carbono"], correct: 0, explanation: "Os seres humanos respiram oxigénio para manter o metabolismo celular a funcionar." },
            { cat: "📜 História", q: "Em que província moçambicana fica localizada a cidade da Beira?", options: ["Sofala", "Nampula", "Gaza"], correct: 0, explanation: "A Beira é a capital da província de Sofala e um porto estratégico de Moçambique." },
            { cat: "🎨 Cultura", q: "Qual é o prato tradicional moçambicano muito conhecido à base de amendoim e folhas?", options: ["Matapa", "Feijoada", "Bacalhau"], correct: 0, explanation: "A matapa é um dos pratos mais emblemáticos e apreciados da culinária moçambicana." }
        ];

        let activeQuestions = [];
        let questionIndex = 0;

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let runSoundInterval = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(550, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } else if (type === 'step') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(80, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'heart') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'hit' || type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        function startRunningSound() {
            if (runSoundInterval) clearInterval(runSoundInterval);
            runSoundInterval = setInterval(() => {
                if (gameRunning && !gamePaused && player.grounded) {
                    playSound('step');
                }
            }, 250);
        }

        function stopRunningSound() {
            if (runSoundInterval) {
                clearInterval(runSoundInterval);
                runSoundInterval = null;
            }
        }

        let score = 0;
        let highscore = localStorage.getItem("quizRunnerHighscore") || 0;
        highscoreEl.innerText = highscore;
        let lives = 3;
        let gameRunning = false;
        let gamePaused = false;
        let frameCount = 0;
        let speed = 5.5;
        let correctOptionText = "";
        let lastExplanation = "";
        let nextLifeMilestone = 500;

        const player = {
            x: 60,
            y: 170,
            width: 32,
            height: 50,
            dy: 0,
            jumpPower: -10,
            gravity: 0.6,
            grounded: true,
            animFrame: 0
        };

        let obstacles = [];
        let nextQuizScore = 100;

        function shuffleQuestions() {
            let arr = [...masterQuestions];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                e.preventDefault();
                handleAction();
            } else if (e.code === "KeyP") {
                togglePause();
            }
        });

        jumpBtn.addEventListener("touchstart", (e) => {
            e.preventDefault();
            handleAction();
        }, { passive: false });

        jumpBtn.addEventListener("click", (e) => {
            e.preventDefault();
            handleAction();
        });

        canvasArea.addEventListener("touchstart", (e) => {
            e.preventDefault();
            handleAction();
        }, { passive: false });

        canvasArea.addEventListener("click", (e) => {
            e.preventDefault();
            handleAction();
        });

        function handleAction() {
            initAudio();
            if (!gameRunning && startScreen.style.display !== "none") {
                startGame();
            } else if (!gameRunning && gameoverScreen.style.display !== "none") {
                startGame();
            } else if (!gamePaused) {
                jump();
            }
        }

        function togglePause() {
            if (!gameRunning) return;
            gamePaused = !gamePaused;
            if (gamePaused) {
                pauseBtn.innerText = "▶️";
                stopRunningSound();
            } else {
                pauseBtn.innerText = "⏸️";
                startRunningSound();
                loop();
            }
        }

        function jump() {
            if (player.grounded && gameRunning && !gamePaused) {
                player.dy = player.jumpPower;
                player.grounded = false;
                playSound('jump');
            }
        }

        function startGame() {
            initAudio();
            startScreen.style.display = "none";
            gameoverScreen.style.display = "none";
            quizModal.style.display = "none";
            explanationModal.style.display = "none";
            score = 0;
            lives = 3;
            speed = 5.5;
            obstacles = [];
            nextQuizScore = 100;
            nextLifeMilestone = 500;
            activeQuestions = shuffleQuestions();
            questionIndex = 0;
            player.y = 170;
            player.dy = 0;
            player.grounded = true;
            updateLivesUI();
            gameRunning = true;
            gamePaused = false;
            pauseBtn.innerText = "⏸️";
            startRunningSound();
            loop();
        }

        function updateLivesUI() {
            let hText = "";
            for (let i = 0; i < lives; i++) hText += "❤️ ";
            livesEl.innerText = hText;
        }

        function spawnObstacle() {
            const types = ["ATENÇÃO", "AVISO", "BARRAGEM", "BLOQUEIO"];
            const label = types[Math.floor(Math.random() * types.length)];
            obstacles.push({
                x: canvas.width,
                y: 190,
                width: 30,
                height: 30,
                label: label
            });
        }

        function showBanner(text, type) {
            feedbackBanner.innerText = text;
            feedbackBanner.className = type === 'correct' ? 'feedback-correct' : 'feedback-wrong';
            feedbackBanner.style.display = 'block';
            setTimeout(() => { feedbackBanner.style.display = 'none'; }, 1500);
        }

        function triggerQuiz() {
            gamePaused = true;
            stopRunningSound();

            if (questionIndex >= activeQuestions.length) {
                activeQuestions = shuffleQuestions();
                questionIndex = 0;
            }

            const qObj = activeQuestions[questionIndex];
            questionIndex++;

            quizCat.innerText = qObj.cat;
            quizQuestion.innerText = qObj.q;
            quizOptions.innerHTML = "";
            
            lastExplanation = qObj.explanation;

            let optionsList = qObj.options.map((opt, idx) => ({
                text: opt,
                isCorrect: (idx === qObj.correct)
            }));

            for (let i = optionsList.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [optionsList[i], optionsList[j]] = [optionsList[j], optionsList[i]];
            }

            let correctObj = optionsList.find(o => o.isCorrect);
            correctOptionText = correctObj.text;

            optionsList.forEach((optItem, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = `${index + 1}. ${optItem.text}`;
                btn.onclick = () => checkAnswer(optItem.isCorrect);
                quizOptions.appendChild(btn);
            });

            quizModal.style.display = "flex";
        }

        function checkAnswer(isCorrect) {
            quizModal.style.display = "none";
            if (isCorrect) {
                playSound('correct');
                score += 100;
                scoreEl.innerText = score;
                showBanner("✨ Resposta Certa! +100 Pontos", "correct");
                nextQuizScore = score + 100;
                gamePaused = false;
                startRunningSound();
                loop();
            } else {
                playSound('wrong');
                correctAnswerDisplay.innerText = `✅ Opção Correta: "${correctOptionText}"`;
                explanationText.innerText = lastExplanation;
                explanationModal.style.display = "flex";
            }
        }

        function closeExplanationAndGameOver() {
            explanationModal.style.display = "none";
            gameOver("Errou a questão! Veja a resposta correta acima.");
        }

        function gameOver(msg) {
            gameRunning = false;
            stopRunningSound();
            playSound('hit');
            finalMsg.innerText = msg;
            if (score > highscore) {
                highscore = score;
                localStorage.setItem("quizRunnerHighscore", highscore);
                highscoreEl.innerText = highscore;
            }
            gameoverScreen.style.display = "flex";
        }

        function drawMan(x, y, grounded, frame) {
            ctx.save();
            ctx.translate(x, y);

            ctx.fillStyle = "#e0ac69";
            ctx.beginPath();
            ctx.arc(16, 9, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#1e1b18";
            ctx.beginPath();
            ctx.arc(16, 5, 7.5, Math.PI, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(9, 16, 15, 20);

            ctx.strokeStyle = "#1e293b";
            ctx.lineWidth = 3.5;
            ctx.lineCap = "round";

            let legCycle = grounded ? Math.sin(frame * 0.22) * 10 : 12;
            
            ctx.beginPath();
            ctx.moveTo(11, 36);
            ctx.lineTo(11 - legCycle, 44);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(21, 36);
            ctx.lineTo(21 + legCycle, 44);
            ctx.stroke();

            ctx.strokeStyle = "#e0ac69";
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(10, 18);
            ctx.lineTo(10 + legCycle, 26);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(22, 18);
            ctx.lineTo(22 - legCycle, 26);
            ctx.stroke();

            ctx.restore();
        }

        function loop() {
            if (!gameRunning || gamePaused) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Chão do jogo
            ctx.fillStyle = "#070a14";
            ctx.fillRect(0, 220, canvas.width, 40);
            ctx.strokeStyle = "#00f0ff";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 220);
            ctx.lineTo(canvas.width, 220);
            ctx.stroke();

            player.dy += player.gravity;
            player.y += player.dy;

            if (player.y > 170) {
                player.y = 170;
                player.dy = 0;
                player.grounded = true;
            }

            player.animFrame++;
            drawMan(player.x, player.y, player.grounded, player.animFrame);

            if (frameCount % 110 === 0) {
                spawnObstacle();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= speed;

                ctx.fillStyle = "#ef4444";
                ctx.beginPath();
                ctx.roundRect(obs.x, obs.y, obs.width, obs.height, 5);
                ctx.fill();
                ctx.strokeStyle = "#fca5a5";
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 6px sans-serif";
                ctx.fillText(obs.label, obs.x + 2, obs.y + 18);

                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y
                ) {
                    playSound('hit');
                    obstacles.splice(i, 1);
                    lives--;
                    updateLivesUI();

                    if (lives <= 0) {
                        gameOver("Esgotou todas as vidas ao colidir com os obstáculos!");
                        return;
                    } else {
                        showBanner("💥 Colisão! Perdeu 1 vida.", "wrong");
                    }
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreEl.innerText = score;

                    if (score >= nextLifeMilestone) {
                        if (lives < 3) {
                            lives++;
                            updateLivesUI();
                            playSound('heart');
                            showBanner("💖 Marco de 500 pontos! +1 Vida ganha!", "correct");
                        }
                        nextLifeMilestone += 500;
                    }

                    if (score >= nextQuizScore) {
                        triggerQuiz();
                        return;
                    }
                }
            }

            speed = 5.5 + Math.floor(score / 350);
            frameCount++;

            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
